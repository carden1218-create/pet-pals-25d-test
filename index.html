<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>Pet Pals Defense 2: 3D War · 萌宠防线 2：3D战争</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    background: #f7f3e3; color: #24183a;
    font-family: "Fredoka", "Nunito", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  }
  canvas#c { display: block; width: 100%; height: 100%; touch-action: none; cursor: pointer; }
  .hud {
    position: fixed; top: max(8px, env(safe-area-inset-top)); left: 10px; right: 10px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    pointer-events: none; z-index: 10;
  }
  .pill-group { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .pill-group.right { flex-wrap: nowrap; }
  .pill {
    pointer-events: auto;
    background: #fffdf6; color: #24183a;
    border: 2.5px solid #24183a; border-radius: 999px;
    padding: 5px 12px; font-weight: 900; font-size: 13.5px; line-height: 1.2;
    box-shadow: 2px 3px 0 #c9ae86, 2px 3px 0 1px #24183a;
    display: inline-flex; align-items: center; gap: 5px;
    white-space: nowrap;
  }
  .pill-title .zh-sub { opacity: 0.85; font-size: 12.5px; }
  .pill-gold { background: #fff4bc; }
  .pill-xp { background: #eef8ff; gap: 6px; }
  .xp-bar { width: 54px; height: 9px; border: 2px solid #24183a; border-radius: 999px; background: #fff; overflow: hidden; }
  .xp-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #4ec6ff, #ffe04a); transition: width 0.16s ease; }
  .upg-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 8px; }
  .upg-card {
    cursor: pointer; background: #fffdf6; color: #24183a;
    border: 3px solid #24183a; border-radius: 16px;
    padding: 12px 10px; text-align: center;
    box-shadow: 3px 4px 0 #c9ae86;
    transition: transform 0.1s ease, background 0.1s ease;
  }
  .upg-card:hover { transform: translateY(-2px); background: #fff7d4; }
  .upg-card:active { transform: translate(1px, 2px); }
  .upg-ico { font-size: 28px; line-height: 1.1; margin-bottom: 5px; }
  .upg-title { font-size: 14px; font-weight: 900; color: #24183a; margin-bottom: 4px; }
  .upg-desc { font-size: 11.5px; font-weight: 700; color: #4c3b64; line-height: 1.35; }
  .pill-btn { cursor: pointer; background: #ffe478; transition: transform 0.08s ease; }
  .pill-btn:active { transform: translate(1px, 2px); }
  .pill-btn.active { background: #ff9c54; }
  .pill-shake { animation: shake 0.28s ease; background: #ffd0c4; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }

  .bottom-bar {
    position: fixed; bottom: max(10px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 8px; z-index: 12; pointer-events: none;
  }
  .mode-btn {
    pointer-events: auto; cursor: pointer;
    background: #fffdf6; color: #24183a;
    border: 2.5px solid #24183a; border-radius: 999px;
    padding: 6px 13px; font-weight: 900; font-size: 12.5px; white-space: nowrap;
    box-shadow: 2px 3px 0 #c9ae86, 2px 3px 0 1px #24183a;
  }
  .mode-btn.plant { background: #dff5b0; }
  .mode-btn.move { background: #ffe285; }
  .hint {
    background: rgba(255, 253, 246, 0.94); color: #24183a;
    border: 2.5px solid #24183a; border-radius: 999px;
    padding: 5px 12px; font-weight: 800; font-size: 12px; white-space: nowrap;
    box-shadow: 2px 3px 0 #c9ae86;
  }

  .joy-zone {
    position: fixed; left: 14px; bottom: max(14px, env(safe-area-inset-bottom));
    width: 102px; height: 102px; border-radius: 50%;
    background: rgba(255, 252, 244, 0.72);
    border: 3px dashed #5e4b3a;
    box-shadow: 2px 3px 0 rgba(201, 174, 134, 0.65);
    touch-action: none; z-index: 14;
    display: flex; align-items: center; justify-content: center;
  }
  .joy-knob {
    width: 44px; height: 44px; border-radius: 50%;
    background: #ffe159; border: 2.5px solid #24183a;
    box-shadow: 2px 2px 0 #24183a;
    pointer-events: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 900;
  }


  .skill-btn {
    position: fixed; right: 16px; bottom: max(18px, env(safe-area-inset-bottom));
    width: 82px; height: 82px; border-radius: 50%;
    background: #fffdf6; color: #24183a;
    border: 3.5px solid #24183a;
    box-shadow: 3px 4px 0 #c9ae86, 3px 4px 0 1px #24183a;
    cursor: pointer; z-index: 15; padding: 4px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    overflow: hidden; transition: transform 0.08s ease;
  }
  .skill-btn.hidden { display: none; }
  .skill-btn.ready { background: #fff4b2; animation: skillPulse 1.3s ease-in-out infinite; }
  .skill-btn:active { transform: translate(1px, 2px); }
  @keyframes skillPulse {
    0%,100% { box-shadow: 3px 4px 0 #c9ae86, 0 0 0 0 rgba(255, 196, 54, 0.55); }
    50% { box-shadow: 3px 4px 0 #c9ae86, 0 0 0 9px rgba(255, 196, 54, 0); }
  }
  .skill-cd-mask {
    position: absolute; inset: 0; border-radius: 50%;
    pointer-events: none; display: none;
    align-items: center; justify-content: center;
    font-size: 18px; font-weight: 900; color: #24183a;
    text-shadow: 0 0 4px #fffdf6, 0 0 4px #fffdf6;
  }
  .skill-btn.on-cd .skill-cd-mask { display: flex; }
  .skill-ico { font-size: 25px; line-height: 1.05; position: relative; z-index: 1; }
  .skill-lbl { font-size: 11px; font-weight: 900; line-height: 1.1; color: #24183a; position: relative; z-index: 1; margin-top: 1px; }
  .skill-key { font-size: 9.5px; font-weight: 800; color: #5b4875; position: relative; z-index: 1; }

  .overlay {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(247, 243, 227, 0.56); backdrop-filter: blur(2px);
    z-index: 20; padding: 18px;
  }
  .overlay.hidden { display: none; }
  .card {
    background: #fffdf6; color: #24183a;
    border: 4px solid #24183a; border-radius: 24px;
    box-shadow: 5px 6px 0 #c9ae86, 5px 6px 0 2px #24183a;
    padding: 20px 22px; max-width: 780px; width: 100%; text-align: center;
  }
  .card h1 { margin: 0 0 6px; font-size: 24px; font-weight: 900; }
  .card p { margin: 0 0 14px; font-size: 14px; font-weight: 700; color: #4c3b64; line-height: 1.4; }
  .hero-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 9px; margin-bottom: 6px; }
  .hero-opt {
    cursor: pointer; background: #fffdf8; color: #24183a;
    border: 3px solid #24183a; border-radius: 18px;
    padding: 10px 8px; text-align: center;
    box-shadow: 3px 4px 0 #c9ae86;
    transition: transform 0.1s ease, background 0.1s ease;
  }
  .hero-opt:hover { transform: translateY(-2px); background: #fff7d4; }
  .hero-opt:active { transform: translate(1px, 2px); }
  .hero-thumb { width: 84px; height: 84px; display: block; margin: 0 auto 4px; }
  .hero-opt .hname { font-size: 14.5px; font-weight: 900; line-height: 1.2; }
  .hero-opt .hsub { font-size: 11.5px; font-weight: 800; color: #5b4875; margin-top: 3px; }
  .big-btn {
    display: inline-block; cursor: pointer;
    background: #ffe14a; color: #24183a;
    border: 3px solid #24183a; border-radius: 16px;
    padding: 10px 26px; font-size: 17px; font-weight: 900;
    box-shadow: 3px 4px 0 #24183a; transition: transform 0.08s ease;
  }
  .big-btn:active { transform: translate(2px, 2px); box-shadow: 1px 2px 0 #24183a; }

  @media (max-width: 720px) {
    .hud { left: 8px; right: 8px; gap: 4px; align-items: flex-start; }
    .pill-group { gap: 4px; }
    .pill { font-size: 11px; padding: 4px 7px; border-width: 2px; }
    .pill-title .zh-sub { display: none; }
    .joy-zone { width: 88px; height: 88px; left: 10px; bottom: max(54px, env(safe-area-inset-bottom)); }
    .joy-knob { width: 38px; height: 38px; font-size: 15px; }
    .skill-btn { width: 74px; height: 74px; right: 12px; bottom: max(56px, env(safe-area-inset-bottom)); }
    .skill-key { display: none; }
    .bottom-bar { width: calc(100% - 16px); justify-content: center; }
    .hint { display: none; }
    .hero-grid { grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .card { padding: 14px 12px; }
    .hero-thumb { width: 62px; height: 62px; }
    .hero-opt .hname { font-size: 12.5px; }
    .hero-opt .hsub { font-size: 10.5px; }
    .xp-bar { width: 38px; height: 8px; }
    .upg-grid { grid-template-columns: 1fr; gap: 8px; }
    .upg-card { display: flex; align-items: center; gap: 10px; text-align: left; padding: 9px 11px; }
    .upg-ico { font-size: 24px; margin-bottom: 0; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud">
  <div class="pill-group">
    <div class="pill pill-title">🌶️ Pet Pals Defense 2: 3D War <span class="zh-sub">· 萌宠防线 2：3D战争</span></div>
    <div class="pill" id="hud-wave">Wave 1 / 5</div>
    <div class="pill pill-gold" id="hud-gold">🪙 60</div>
    <div class="pill pill-xp" id="hud-xp"><span id="xp-lvl">Lv.1</span><span class="xp-bar"><span class="xp-fill" id="xp-fill"></span></span></div>
  </div>
  <div class="pill-group right">
    <div class="pill" id="hud-life">❤️ 1</div>
    <button class="pill pill-btn" id="btn-speed" type="button">1×</button>
    <button class="pill pill-btn" id="btn-reset" type="button">↺</button>
  </div>
</div>

<div class="joy-zone" id="joy-zone" aria-label="Move Joystick">
  <div class="joy-knob" id="joy-knob">🐾</div>
</div>

<button class="skill-btn hidden" id="btn-skill" type="button" aria-label="Active Skill">
  <span class="skill-ico" id="skill-ico">🔥</span>
  <span class="skill-lbl" id="skill-lbl">火环</span>
  <span class="skill-key">[Q/空格]</span>
  <span class="skill-cd-mask" id="skill-cd-mask"></span>
</button>

<div class="bottom-bar">
  <button class="mode-btn plant" id="btn-mode" type="button">🌱 点草地种椒椒鼠 (50🪙)</button>
  <div class="hint" id="hint">WASD / 摇杆 / 右键自由移动主角 · 点草地种宠物炮台</div>
</div>

<div class="overlay" id="pick-overlay">
  <div class="card">
    <h1>选择你的主角宠物 · Pick Hero</h1>
    <p>原版一代蜡笔萌宠贴在立体瓦楞纸板上！选一只主角亲自上阵跑动战斗。</p>
    <div class="hero-grid">
      <button class="hero-opt" data-hero="chili" type="button">
        <canvas class="hero-thumb" width="130" height="130" data-thumb="chili"></canvas>
        <div class="hname">🌶️ 椒椒鼠</div>
        <div class="hsub">Chili · 火焰蜡笔</div>
      </button>
      <button class="hero-opt" data-hero="lemon" type="button">
        <canvas class="hero-thumb" width="130" height="130" data-thumb="lemon"></canvas>
        <div class="hname">⚡ 闪电鸡</div>
        <div class="hsub">Lemon · 极速闪电</div>
      </button>
      <button class="hero-opt" data-hero="blueberry" type="button">
        <canvas class="hero-thumb" width="130" height="130" data-thumb="blueberry"></canvas>
        <div class="hname">🫐 蓝莓枭</div>
        <div class="hsub">Blueberry · 冰霜溅射</div>
      </button>
      <button class="hero-opt" data-hero="coco" type="button">
        <canvas class="hero-thumb" width="130" height="130" data-thumb="coco"></canvas>
        <div class="hname">💧 椰椰獭</div>
        <div class="hsub">Coco · 水浪击退</div>
      </button>
      <button class="hero-opt" data-hero="taro" type="button">
        <canvas class="hero-thumb" width="130" height="130" data-thumb="taro"></canvas>
        <div class="hname">🪨 芋岩熊</div>
        <div class="hsub">Taro · 巨岩震击</div>
      </button>
    </div>
  </div>
</div>

<div class="overlay hidden" id="levelup-overlay">
  <div class="card">
    <h1 id="lvl-title">⭐ 主角升级！选一个强化</h1>
    <p id="lvl-sub">点击卡片或按 1 / 2 / 3 选择，打怪更快更爽！</p>
    <div class="upg-grid" id="upg-grid"></div>
  </div>
</div>

<div class="overlay hidden" id="overlay">
  <div class="card">
    <h1 id="ov-title">You win!</h1>
    <p id="ov-sub">守住小窝了！</p>
    <button class="big-btn" id="ov-btn" type="button">Replay / 再玩一次</button>
  </div>
</div>

<script src="paper-craft.js?v=14"></script>
<script src="game.js?v=14"></script>
</body>
</html>
