<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>Pet Pals Defense 2: 3D War · 萌宠防线 2：3D战争</title>
<style>
  :root {
    --ol: #2b1b22; --ink: #3a2630; --dim: #7a5c64;
    --cream: #fff8e6; --cream2: #ffefc8;
    --pink: #ff6f9a; --gold: #ffc83a; --mint: #5fcf86; --sky: #6cb8ff; --lav: #a98aff; --red: #ff6a5a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    background: #9ad77a; color: var(--ink);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", "Fredoka", "Nunito", sans-serif;
  }
  canvas#c { display: block; width: 100%; height: 100%; touch-action: none; cursor: pointer; }
  .hud {
    position: fixed; top: max(8px, env(safe-area-inset-top)); left: 10px; right: 10px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    pointer-events: none; z-index: 10;
  }
  .pill-group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .pill-group.right { flex-wrap: nowrap; }
  .pill {
    pointer-events: auto;
    background: var(--cream); color: var(--ink);
    border: 3px solid var(--ol); border-radius: 999px;
    padding: 4px 11px; font-weight: 900; font-size: 13px; line-height: 1.2;
    box-shadow: 0 3px 0 var(--ol);
    display: inline-flex; align-items: center; gap: 5px;
    white-space: nowrap;
  }
  .pill-title { background: var(--gold); }
  .pill-title .zh-sub { opacity: 0.9; font-size: 12px; }
  .pill-gold { background: #ffe57a; }
  .pill-hp { background: #ffd8de; gap: 6px; }
  .hp-mini-bar { width: 52px; height: 9px; border: 2px solid var(--ol); border-radius: 999px; background: #fff; overflow: hidden; }
  .hp-mini-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #ff5468, #ff9a44); transition: width 0.14s ease; }
  .pill-xp { background: #dff2ff; gap: 6px; }
  .xp-bar { width: 52px; height: 9px; border: 2px solid var(--ol); border-radius: 999px; background: #fff; overflow: hidden; }
  .xp-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #56c2ff, #ffd644); transition: width 0.16s ease; }

  .boss-bar-wrap {
    position: fixed; top: max(50px, calc(env(safe-area-inset-top) + 42px)); left: 50%; transform: translateX(-50%);
    width: min(440px, calc(100% - 24px)); z-index: 11; pointer-events: none;
    background: var(--cream); border: 3.5px solid var(--ol); border-radius: 16px;
    padding: 6px 10px 7px; box-shadow: 0 4px 0 var(--ol);
  }
  .boss-bar-wrap.hidden { display: none; }
  .boss-bar-head {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 13px; font-weight: 900; margin-bottom: 4px; color: var(--ink);
  }
  .boss-skill-tag {
    background: var(--gold); border: 2px solid var(--ol); border-radius: 999px;
    padding: 1px 8px; font-size: 11px; font-weight: 900;
  }
  .boss-bar-track {
    width: 100%; height: 13px; border: 2.5px solid var(--ol); border-radius: 999px;
    background: #3a2334; overflow: hidden;
  }
  .boss-bar-fill {
    height: 100%; width: 100%; background: linear-gradient(90deg, #ff4468, #ff963a);
    transition: width 0.1s ease;
  }

  .upg-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
  .upg-card {
    cursor: pointer; background: #fff; color: var(--ink);
    border: 3px solid var(--ol); border-radius: 18px;
    padding: 12px 10px; text-align: center;
    box-shadow: 0 4px 0 var(--ol);
    transition: transform 0.08s ease, background 0.1s ease;
  }
  .upg-card:hover { transform: translateY(-2px); background: var(--cream2); }
  .upg-card:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ol); }
  .upg-ico { font-size: 28px; line-height: 1.1; margin-bottom: 5px; }
  .upg-title { font-size: 14px; font-weight: 900; color: var(--ink); margin-bottom: 4px; }
  .upg-desc { font-size: 11.5px; font-weight: 700; color: var(--dim); line-height: 1.35; }
  .pill-btn { cursor: pointer; background: var(--gold); transition: transform 0.08s ease; }
  .pill-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ol); }
  .pill-btn.active { background: var(--pink); color: #fff; }
  .pill-shake { animation: shake 0.28s ease; background: #ffd0c4; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }

  .bottom-bar {
    position: fixed; bottom: max(10px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 8px; z-index: 12; pointer-events: none;
  }
  .hint {
    background: var(--cream); color: var(--ink);
    border: 3px solid var(--ol); border-radius: 999px;
    padding: 5px 14px; font-weight: 900; font-size: 12px; white-space: nowrap;
    box-shadow: 0 3px 0 var(--ol);
  }

  .joy-zone {
    position: fixed; left: 14px; bottom: max(14px, env(safe-area-inset-bottom));
    width: 102px; height: 102px; border-radius: 50%;
    background: rgba(255, 248, 230, 0.80);
    border: 3px dashed var(--ol);
    box-shadow: 0 4px 0 rgba(43, 27, 34, 0.35);
    touch-action: none; z-index: 14;
    display: flex; align-items: center; justify-content: center;
  }
  .joy-knob {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--gold); border: 3px solid var(--ol);
    box-shadow: 0 3px 0 var(--ol);
    pointer-events: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 900;
  }

  .skill-bar {
    position: fixed; right: 14px; bottom: max(16px, env(safe-area-inset-bottom));
    display: flex; align-items: flex-end; gap: 9px; z-index: 15;
  }
  .skill-btn {
    position: relative;
    width: 76px; height: 76px; border-radius: 50%;
    background: var(--cream); color: var(--ink);
    border: 3.5px solid var(--ol);
    box-shadow: 0 4px 0 var(--ol);
    cursor: pointer; padding: 3px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    overflow: hidden; transition: transform 0.08s ease;
  }
  .skill-btn.hidden { display: none; }
  .skill-btn.ready { background: #ffe98a; animation: skillPulse 1.3s ease-in-out infinite; }
  .skill-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ol); }
  @keyframes skillPulse {
    0%,100% { box-shadow: 0 4px 0 var(--ol), 0 0 0 0 rgba(255, 200, 58, 0.55); }
    50% { box-shadow: 0 4px 0 var(--ol), 0 0 0 8px rgba(255, 200, 58, 0); }
  }
  .skill-lvl-badge {
    position: absolute; top: 3px; right: 7px; z-index: 2;
    font-size: 9.5px; font-weight: 900; color: #fff;
    background: var(--pink); border: 2px solid var(--ol); border-radius: 999px;
    padding: 0 4px; line-height: 1.2;
  }
  .skill-cd-mask {
    position: absolute; inset: 0; border-radius: 50%;
    pointer-events: none; display: none;
    align-items: center; justify-content: center;
    font-size: 16px; font-weight: 900; color: var(--ol);
    text-shadow: 0 0 4px #fff8e6, 0 0 4px #fff8e6;
    z-index: 3;
  }
  .skill-btn.on-cd .skill-cd-mask { display: flex; }
  .skill-ico { font-size: 23px; line-height: 1.05; position: relative; z-index: 1; }
  .skill-lbl { font-size: 10.5px; font-weight: 900; line-height: 1.1; color: var(--ink); position: relative; z-index: 1; margin-top: 1px; }
  .skill-key { font-size: 9px; font-weight: 800; color: var(--dim); position: relative; z-index: 1; }

  .overlay {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(30, 18, 36, 0.50); backdrop-filter: blur(2px);
    z-index: 20; padding: 18px;
  }
  .overlay.hidden { display: none; }
  .card {
    background: var(--cream); color: var(--ink);
    border: 4px solid var(--ol); border-radius: 26px;
    box-shadow: 0 7px 0 var(--ol), 0 18px 40px rgba(0,0,0,0.3);
    padding: 18px 20px; max-width: 720px; width: 100%; text-align: center;
  }
  .ribbon {
    display: inline-block;
    background: var(--gold); border: 3.5px solid var(--ol); border-radius: 16px;
    box-shadow: 0 4px 0 var(--ol);
    padding: 4px 20px; font-weight: 900; font-size: 20px; color: var(--ol);
    margin-bottom: 8px;
  }
  .ribbon.pink { background: var(--pink); color: var(--ol); }
  .card h1 { margin: 0 0 6px; font-size: 22px; font-weight: 900; color: var(--ol); }
  .card p { margin: 0 0 12px; font-size: 13.5px; font-weight: 700; color: var(--dim); line-height: 1.4; }
  .hero-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin-bottom: 4px; }
  .hero-opt {
    cursor: pointer; background: #fff; color: var(--ink);
    border: 3px solid var(--ol); border-radius: 18px;
    padding: 8px 8px; text-align: center;
    box-shadow: 0 4px 0 var(--ol);
    transition: transform 0.08s ease, background 0.1s ease;
  }
  .hero-opt:hover { transform: translateY(-2px); background: var(--cream2); }
  .hero-opt:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ol); }
  .hero-thumb { width: 74px; height: 74px; display: block; margin: 0 auto 3px; }
  .hero-opt .hname { font-size: 14px; font-weight: 900; line-height: 1.2; color: var(--ol); }
  .hero-opt .hsub { font-size: 11px; font-weight: 800; color: var(--dim); margin-top: 2px; }
  .big-btn {
    display: inline-block; cursor: pointer;
    background: var(--pink); color: #fff;
    border: 3.5px solid var(--ol); border-radius: 18px;
    padding: 10px 28px; font-size: 18px; font-weight: 900;
    box-shadow: 0 4px 0 var(--ol); transition: transform 0.08s ease;
  }
  .big-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ol); }

  @media (max-width: 720px) {
    .hud { left: 8px; right: 8px; gap: 4px; align-items: flex-start; }
    .pill-group { gap: 4px; }
    .pill { font-size: 10.5px; padding: 3.5px 7px; border-width: 2.5px; }
    .pill-title .zh-sub, .pill-title { display: none; }
    .joy-zone { width: 84px; height: 84px; left: 10px; bottom: max(22px, env(safe-area-inset-bottom)); }
    .joy-knob { width: 36px; height: 36px; font-size: 14px; }
    .skill-bar { right: 10px; bottom: max(22px, env(safe-area-inset-bottom)); gap: 6px; }
    .skill-btn { width: 64px; height: 64px; }
    .skill-ico { font-size: 20px; }
    .skill-lbl { font-size: 9.5px; }
    .skill-key { display: none; }
    .bottom-bar { display: none; }
    .hero-grid { grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .card { padding: 14px 12px; }
    .hero-thumb { width: 58px; height: 58px; }
    .hero-opt .hname { font-size: 12px; }
    .hero-opt .hsub { font-size: 10px; }
    .xp-bar, .hp-mini-bar { width: 34px; height: 8px; }
    .upg-grid { grid-template-columns: 1fr; gap: 8px; }
    .upg-card { display: flex; align-items: center; gap: 10px; text-align: left; padding: 9px 11px; }
    .upg-ico { font-size: 24px; margin-bottom: 0; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud">
  <div class="pill-group">
    <div class="pill pill-title">🌶️ Pet Pals Defense 2 <span class="zh-sub">· 无尽战争</span></div>
    <div class="pill" id="hud-wave">Wave 1 · 无尽</div>
    <div class="pill pill-hp" id="hud-hero-hp"><span>HP</span><span class="hp-mini-bar"><span class="hp-mini-fill" id="hero-hp-fill"></span></span><span id="hero-hp-txt">100</span></div>
    <div class="pill pill-gold" id="hud-gold">🪙 60</div>
    <div class="pill pill-xp" id="hud-xp"><span id="xp-lvl">Lv.1</span><span class="xp-bar"><span class="xp-fill" id="xp-fill"></span></span></div>
  </div>
  <div class="pill-group right">
    <div class="pill" id="hud-life">❤️ 1</div>
    <button class="pill pill-btn" id="btn-mute" type="button" aria-label="Mute">🔊</button>
    <button class="pill pill-btn" id="btn-speed" type="button">1×</button>
    <button class="pill pill-btn" id="btn-reset" type="button">↺</button>
  </div>
</div>

<div class="boss-bar-wrap hidden" id="boss-bar-wrap">
  <div class="boss-bar-head">
    <span id="boss-name">👑 果冻史莱姆王</span>
    <span class="boss-skill-tag" id="boss-skill-tag">蓄力中</span>
  </div>
  <div class="boss-bar-track"><div class="boss-bar-fill" id="boss-bar-fill"></div></div>
</div>

<div class="joy-zone" id="joy-zone" aria-label="Move Joystick">
  <div class="joy-knob" id="joy-knob">🐾</div>
</div>

<div class="skill-bar" id="skill-bar">
  <button class="skill-btn hidden" id="skill-slot-0" type="button" aria-label="Skill 1">
    <span class="skill-lvl-badge" id="skill-lvl-0">Lv1</span>
    <span class="skill-ico" id="skill-ico-0">🔥</span>
    <span class="skill-lbl" id="skill-lbl-0">火环</span>
    <span class="skill-key">[Q]</span>
    <span class="skill-cd-mask" id="skill-cd-0"></span>
  </button>
  <button class="skill-btn hidden" id="skill-slot-1" type="button" aria-label="Skill 2">
    <span class="skill-lvl-badge" id="skill-lvl-1">Lv1</span>
    <span class="skill-ico" id="skill-ico-1">☄️</span>
    <span class="skill-lbl" id="skill-lbl-1">陨星</span>
    <span class="skill-key">[E]</span>
    <span class="skill-cd-mask" id="skill-cd-1"></span>
  </button>
  <button class="skill-btn hidden" id="skill-slot-2" type="button" aria-label="Skill 3">
    <span class="skill-lvl-badge" id="skill-lvl-2">Lv1</span>
    <span class="skill-ico" id="skill-ico-2">🐉</span>
    <span class="skill-lbl" id="skill-lbl-2">火墙</span>
    <span class="skill-key">[R]</span>
    <span class="skill-cd-mask" id="skill-cd-2"></span>
  </button>
</div>

<div class="bottom-bar">
  <div class="hint" id="hint">WASD / 摇杆 / 点击草地移动主角 · Q/E/R 或点击技能按钮释放大招 · 无尽生存!</div>
</div>

<div class="overlay" id="pick-overlay">
  <div class="card">
    <div class="ribbon pink">萌宠防线 2 · 3D战争</div><h1>选择你的主角宠物 · Pick Hero</h1>
    <p>原版一代萌宠贴在立体瓦楞纸板上！选一只主角亲自跑位、挥剑或释放大招迎战无尽史莱姆大军！</p>
    <div class="hero-grid">
      <button class="hero-opt" data-hero="chili" type="button">
        <canvas class="hero-thumb" width="130" height="130" data-thumb="chili"></canvas>
        <div class="hname">🌶️ 椒椒鼠</div>
        <div class="hsub">Chili · 火焰连珠</div>
      </button>
      <button class="hero-opt" data-hero="lemon" type="button">
        <canvas class="hero-thumb" width="130" height="130" data-thumb="lemon"></canvas>
        <div class="hname">⚡ 闪电鸡</div>
        <div class="hsub">Lemon · 天雷劈击</div>
      </button>
      <button class="hero-opt" data-hero="blueberry" type="button">
        <canvas class="hero-thumb" width="130" height="130" data-thumb="blueberry"></canvas>
        <div class="hname">🫐 蓝莓枭</div>
        <div class="hsub">Blueberry · 冰霜溅射</div>
      </button>
      <button class="hero-opt" data-hero="coco" type="button">
        <canvas class="hero-thumb" width="130" height="130" data-thumb="coco"></canvas>
        <div class="hname">💧 椰椰獭</div>
        <div class="hsub">Coco · 水浪击退</div>
      </button>
      <button class="hero-opt" data-hero="taro" type="button">
        <canvas class="hero-thumb" width="130" height="130" data-thumb="taro"></canvas>
        <div class="hname">🪨 芋岩熊</div>
        <div class="hsub">Taro · 巨岩震击</div>
      </button>
      <button class="hero-opt" data-hero="chestnut" type="button">
        <canvas class="hero-thumb" width="130" height="130" data-thumb="chestnut"></canvas>
        <div class="hname">⚔️ 刺栗剑圣</div>
        <div class="hsub">Chestnut · 近战剑舞</div>
      </button>
    </div>
  </div>
</div>

<div class="overlay hidden" id="levelup-overlay">
  <div class="card">
    <div class="ribbon">⭐ 主角升级</div><h1 id="lvl-title">选一个强化</h1>
    <p id="lvl-sub">点击卡片或按 1 / 2 / 3 选择！每升一级：攻击 +10%、生命 +8</p>
    <div class="upg-grid" id="upg-grid"></div>
  </div>
</div>

<div class="overlay hidden" id="overlay">
  <div class="card">
    <h1 id="ov-title">Defeat! 💥</h1>
    <p id="ov-sub">坚持到了第 1 波！</p>
    <button class="big-btn" id="ov-btn" type="button">Try again / 再试一次</button>
  </div>
</div>

<script src="audio.js?v=20"></script>
<script src="paper-craft.js?v=20"></script>
<script src="game.js?v=20"></script>
</body>
</html>
